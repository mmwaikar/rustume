name: Deploy rustume to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-11
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build web application
        run: |
          cargo build --lib --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir web/wasm target/wasm32-unknown-unknown/release/rustume.wasm
          npm install --prefix web
          npm run build --prefix web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
